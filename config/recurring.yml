production:
  sync_stops:
    class: SyncStopsJob
    args: [ 100 ]
    schedule: every 5 minutes
  sync_stops_midnight:
    class: SyncSchedulesJob
    schedule: '0 0 * * *' # every day at 00:00
  sync_stops_morning:
    class: SyncStopsJob
    schedule: '0 8 * * *' # every day at 08:00
  sync_stops_evening:
    class: SyncSchedulesJob
    schedule: '0 23 * * *' # every day at 23:00

