services:
  db:
    image: postgres:17.4-alpine
    restart: always
    ports:
      - '5432:5432'
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - database_data:/var/lib/postgresql/data
    command: >
      postgres
      -c shared_preload_libraries='pg_stat_statements'
volumes:
  database_data:
    driver: local
